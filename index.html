
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موسوعة مواد التجميل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#18324b}
header{background:#123c69;color:white;padding:24px 16px;text-align:center}
header h1{margin:0 0 10px;font-size:26px}
header p{margin:0;color:#dce9f6;line-height:1.8}
main{width:min(100% - 28px,850px);margin:24px auto}
.search-box,input{width:100%;padding:14px;border:1px solid #d5e0eb;border-radius:12px;font-size:16px;background:white;margin:7px 0}
h2{font-size:21px;margin:26px 0 14px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#123c69;color:white;font-size:16px;margin:6px 0;cursor:pointer}
button:disabled{opacity:.5}
.alt{background:#e2edf8;color:#123c69}
.panel,.material,.empty{background:white;border:1px solid #e0e8f0;border-radius:14px;padding:17px;margin:12px 0}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.category{background:white;border:1px solid #e0e8f0;border-radius:14px;padding:18px 10px;text-align:center;font-weight:bold;color:#174a78;cursor:pointer}
.category.active{background:#123c69;color:white}
.material h3{margin:0 0 9px;font-size:19px;color:#174a78}
.material p{margin:7px 0;line-height:1.8;color:#52677b;overflow-wrap:anywhere}
.materials{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.empty{text-align:center;padding:22px;color:#65788b;line-height:1.8}
.notice{padding:12px;border-radius:10px;background:#edf4fb;line-height:1.8;overflow-wrap:anywhere}
.error{background:#fff0f0;color:#9b2020}
footer{text-align:center;padding:24px 12px;color:#6a7d90;font-size:14px}
.hidden,[hidden]{display:none!important}
@media(min-width:600px){.categories{grid-template-columns:repeat(3,minmax(0,1fr))}.materials{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>موسوعة مواد التجميل</h1>
<p>مرجع تعليمي للتعرّف على المواد الخام التجميلية وخصائصها</p>
</header>

<main>
<section id="authPanel" class="panel">
<h2 style="margin-top:0">تسجيل الدخول للموسوعة</h2>
<p>سجّل دخولك أو أنشئ حساباً جديداً للوصول إلى المواد بعد اعتماد الحساب.</p>

<div id="loginForm">
<input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
<input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="loginBtn">تسجيل الدخول</button>
<button id="showSignup" class="alt">إنشاء حساب جديد</button>
</div>

<div id="signupForm" class="hidden">
<input id="fullName" placeholder="الاسم الكامل" autocomplete="name">
<input id="phone" type="tel" placeholder="رقم الهاتف">
<input id="signupEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
<input id="signupPassword" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="new-password">
<button id="signupBtn">إنشاء الحساب</button>
<button id="showLogin" class="alt">العودة لتسجيل الدخول</button>
</div>
<p id="authMessage" class="notice hidden" role="status"></p>
</section>

<section id="pendingPanel" class="panel hidden">
<h2 id="pendingTitle" style="margin-top:0">حالة الحساب</h2>
<p id="pendingText"></p>
<button id="retryBtn" class="alt">إعادة التحقق</button>
<button id="logoutPending">تسجيل الخروج</button>
</section>

<section id="library" class="hidden">
<div class="panel">
<p id="welcome"></p>
<button id="logoutBtn" class="alt">تسجيل الخروج</button>
<input id="search" class="search-box" type="search" placeholder="ابحث باسم المادة أو وصفها...">
<h2>أقسام الموسوعة</h2>
<section id="categories" class="categories"></section>
<h2>المواد الموجودة</h2>
<p id="count"></p>
</div>
<section id="materials" class="materials"></section>
<p id="empty" class="empty hidden"></p>
</section>
</main>

<footer>موسوعة مواد التجميل — محتوى تعليمي</footer>

<script>
const SUPABASE_URL = "https://dmueztnxogbrvlnoveok.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZLLhwBg3VfIjBpASDcm2hA_B3KNkafx";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let materialsData = [];
let selectedCategory = "الكل";
let busy = false;

function showOnly(id){
  ["authPanel","pendingPanel","library"].forEach(x=>$(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}
function showMessage(text,error=false){
  $("authMessage").textContent=text;
  $("authMessage").className="notice"+(error?" error":"");
}
function errorText(error){
  const m=error?.message||"حصل خطأ غير معروف.";
  if(/Invalid login credentials/i.test(m))return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  if(/Email not confirmed/i.test(m))return "أكد بريدك الإلكتروني من الرسالة المرسلة ليك ثم سجّل دخول.";
  if(/User already registered/i.test(m))return "البريد مسجل من قبل. جرّب تسجيل الدخول.";
  if(/Failed to fetch|NetworkError/i.test(m))return "تعذر الاتصال. اتأكد من الإنترنت وحاول تاني.";
  return m;
}
function setBusy(v){
  busy=v;
  ["loginBtn","signupBtn"].forEach(id=>$(id).disabled=v);
}
$("showSignup").onclick=()=>{
  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");
  $("authMessage").classList.add("hidden");
};
$("showLogin").onclick=()=>{
  $("signupForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
  $("authMessage").classList.add("hidden");
};

$("signupBtn").onclick=async()=>{
  if(busy)return;
  const name=$("fullName").value.trim();
  const phone=$("phone").value.trim();
  const email=$("signupEmail").value.trim();
  const password=$("signupPassword").value;
  if(!name||!email||!password)return showMessage("أدخل الاسم والبريد وكلمة المرور.",true);
  if(password.length<8)return showMessage("كلمة المرور لازم تكون 8 أحرف على الأقل.",true);

  setBusy(true);
  try{
    const {data,error}=await client.auth.signUp({
      email,password,
      options:{
        data:{full_name:name,phone},
        emailRedirectTo:location.origin+location.pathname
      }
    });
    if(error)throw error;
    if(data.session&&data.user){
      await loadUser(data.user);
    }else{
      showMessage("تم إنشاء طلب الحساب. افتح بريدك الإلكتروني وأكد الحساب، ثم ارجع وسجّل دخول.");
    }
  }catch(e){showMessage(errorText(e),true)}
  finally{setBusy(false)}
};

$("loginBtn").onclick=async()=>{
  if(busy)return;
  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;
  if(!email||!password)return showMessage("أدخل البريد الإلكتروني وكلمة المرور.",true);
  setBusy(true);
  try{
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error)throw error;
    await loadUser(data.user);
  }catch(e){showMessage(errorText(e),true)}
  finally{setBusy(false)}
};

async function loadUser(user){
  showOnly("pendingPanel");
  $("pendingTitle").textContent="جارٍ التحقق من الحساب";
  $("pendingText").textContent="لحظة واحدة...";
  $("retryBtn").classList.add("hidden");
  try{
    let {data:profile,error}=await client.from("profiles")
      .select("id,full_name,payment_status,is_admin")
      .eq("id",user.id).maybeSingle();
    if(error)throw error;

    if(!profile){
      const meta=user.user_metadata||{};
      const {data:newProfile,error:insertError}=await client.from("profiles")
        .insert({
          id:user.id,
          full_name:meta.full_name||user.email||"مستخدم",
          phone:meta.phone||"",
          payment_status:"pending",
          is_admin:false
        })
        .select("id,full_name,payment_status,is_admin").single();
      if(insertError)throw insertError;
      profile=newProfile;
    }

    if(!profile.is_admin&&profile.payment_status!=="approved"){
      $("pendingTitle").textContent=profile.payment_status==="rejected"?"الطلب مرفوض":"الحساب قيد المراجعة";
      $("pendingText").textContent=profile.payment_status==="rejected"
        ?"حسابك غير معتمد حالياً. تواصل مع الإدارة."
        :"حسابك مسجل، لكن المواد لن تظهر إلا بعد اعتماد الإدارة.";
      $("retryBtn").classList.remove("hidden");
      return;
    }
    $("welcome").textContent="مرحباً "+(profile.full_name||user.email);
    await loadMaterials();
  }catch(e){
    $("pendingTitle").textContent="تعذر التحقق من الحساب";
    $("pendingText").textContent=errorText(e)+" — راجع إعدادات جدول profiles وسياساته في Supabase.";
    $("retryBtn").classList.remove("hidden");
  }
}

async function loadMaterials(){
  showOnly("pendingPanel");
  $("pendingTitle").textContent="جارٍ تحميل الموسوعة";
  $("pendingText").textContent="جاري جلب المواد من Supabase...";
  try{
    const {data,error}=await client.from("materials")
      .select("id,name,description,scientific_name,uses,benefits,safety_notes,category")
      .order("name");
    if(error)throw error;
    materialsData=data||[];
    selectedCategory="الكل";
    $("search").value="";
    showOnly("library");
    renderCategories();
    renderMaterials();
  }catch(e){
    $("pendingTitle").textContent="تعذر تحميل المواد";
    $("pendingText").textContent=errorText(e);
    $("retryBtn").classList.remove("hidden");
    showOnly("pendingPanel");
  }
}

function renderCategories(){
  const root=$("categories");
  root.replaceChildren();
  const names=["الكل",...new Set(materialsData.map(m=>m.category).filter(Boolean))];
  names.forEach(name=>{
    const el=document.createElement("div");
    el.className="category"+(selectedCategory===name?" active":"");
    el.textContent=name;
    el.onclick=()=>{selectedCategory=name;renderCategories();renderMaterials()};
    root.appendChild(el);
  });
}

function renderMaterials(){
  const root=$("materials");
  root.replaceChildren();
  const term=$("search").value.trim().toLowerCase();
  const filtered=materialsData.filter(m=>{
    const text=[m.name,m.description,m.scientific_name,m.uses,m.benefits,m.safety_notes,m.category]
      .filter(Boolean).join(" ").toLowerCase();
    return (selectedCategory==="الكل"||m.category===selectedCategory)&&text.includes(term);
  });
  $("count").textContent="عدد المواد: "+filtered.length;
  $("empty").classList.toggle("hidden",filtered.length>0);
  $("empty").textContent=materialsData.length
    ?"ما لقينا مادة مطابقة للبحث."
    :"تم الربط، لكن جدول المواد فارغ. أضف المواد إلى جدول materials في Supabase.";
  filtered.forEach(m=>{
    const card=document.createElement("article");
    card.className="material";
    const title=document.createElement("h3");
    title.textContent=m.name||"مادة بدون اسم";
    card.appendChild(title);
    [["الاسم العلمي",m.scientific_name],["التعريف",m.description],
     ["الاستخدامات",m.uses],["الفوائد",m.benefits],
     ["ملاحظات السلامة",m.safety_notes],["القسم",m.category]]
    .forEach(([label,value])=>{
      if(!value)return;
      const p=document.createElement("p");
      const b=document.createElement("strong");
      b.textContent=label+": ";
      p.append(b,document.createTextNode(value));
      card.appendChild(p);
    });
    root.appendChild(card);
  });
}
$("search").addEventListener("input",renderMaterials);
$("retryBtn").onclick=async()=>{
  const {data}=await client.auth.getUser();
  if(data.user)await loadUser(data.user);
  else showOnly("authPanel");
};
async function logout(){
  await client.auth.signOut();
  materialsData=[];
  $("materials").replaceChildren();
  showOnly("authPanel");
}
$("logoutBtn").onclick=logout;
$("logoutPending").onclick=logout;

client.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"){
    materialsData=[];
    $("materials").replaceChildren();
    showOnly("authPanel");
  }
});
(async()=>{
  try{
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(data.session)await loadUser(data.session.user);
    else showOnly("authPanel");
  }catch(e){
    showOnly("authPanel");
    showMessage("تعذر الاتصال بـ Supabase: "+errorText(e),true);
  }
})();
</script>
</body>
</html>
